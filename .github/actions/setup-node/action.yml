name: Setup Node Environment
description: Reusable action to configure Node.js
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '20'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Display Node Version
      shell: pwsh
      run: |
        $nodePath = (Get-Command node).Source
        Write-Host "Resolved node path: $nodePath"
        & $nodePath --version

    - name: Display NPM Version
      shell: pwsh
      run: |
        $npmPath = (Get-Command npm).Source
        Write-Host "Resolved npm path: $npmPath"
        & $npmPath --version