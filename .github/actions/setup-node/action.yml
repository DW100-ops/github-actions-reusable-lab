name: Setup Node Environment
description: Reusable action to configure Node.js
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '20'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Display Node Version
      shell: bash
      run: node --version

    - name: Display NPM Version
      shell: bash
      run: npm --version
